<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembayaran Sukses - Burning Pixel</title>
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card" style="text-align: center;">
      <div style="width: 72px; height: 72px; border-radius: 50%; background: rgba(20, 184, 166, 0.1); color: var(--primary); display: flex; align-items: center; justify-content: center; margin: 0 auto 2rem auto; box-shadow: var(--glow-primary);">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
      
      <h1 style="font-size: 1.75rem; font-weight: 800; margin-bottom: 0.75rem;">Pembayaran Berhasil!</h1>
      <p style="color: var(--muted); font-size: 0.95rem; margin-bottom: 2.5rem; line-height: 1.6;">
        Terima kasih atas kepercayaan Anda. Sistem kami telah mencatat pelunasan transaksi Anda. Tim kami akan segera menghubungi Anda untuk mulai merancang website impian Anda.
      </p>
      
      <div style="display: flex; flex-direction: column; gap: 0.75rem;">
        <a href="account.html" class="btn btn-primary" style="width: 100%;">Masuk Dashboard</a>
        <a href="index.html" class="btn btn-secondary" style="width: 100%;">Kembali ke Beranda</a>
      </div>
    </div>
  </div>

</body>
</html>
